<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System Design Mastery</title>
<meta name="description" content="A 12-week, case-study-driven system design course for startup technical interviews.">
<meta name="theme-color" content="#f3f3f3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="System Design">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Open week list">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 4.5H16M2 9H16M2 13.5H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <div class="topbar-title">
      <span class="dot" aria-hidden="true"></span>
      <span>System Design Mastery</span>
    </div>
    <div class="topbar-progress" id="topProgress">0 / 12</div>
  </header>

  <div class="shell">
    <nav id="sidebar" class="sidebar" aria-label="Course weeks">
      <div class="sidebar-head">
        <div class="sidebar-head-title">COURSE — 12 WEEKS</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <ol id="weekList" class="week-list"></ol>
      <div class="sidebar-foot">
        Built from your CodeKredos case-study list &amp; your Technical Interview Prep Guide.
      </div>
    </nav>
    <div id="overlay" class="overlay"></div>

    <main id="main" class="main">
      <div class="tabbar" id="tabbar"><!-- open-file style tabs, populated by JS --></div>
      <article id="content" class="content"></article>
      <div class="pager">
        <button id="prevBtn" class="pager-btn" type="button">&larr; Previous</button>
        <button id="completeBtn" class="pager-btn pager-btn-accent" type="button">Mark week complete</button>
        <button id="nextBtn" class="pager-btn" type="button">Next &rarr;</button>
      </div>
    </main>
  </div>
</div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
