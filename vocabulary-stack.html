    var html = '<h3>Progress</h3>';
    for (var i=0;i<DOMAINS.length;i++){
      var d = DOMAINS[i];
      var tot = totalTerms(d), kn = knownCount(d);
      totAll += tot; knAll += kn;
      var pct = tot ? Math.round(kn/tot*100) : 0;
      html += '<div class="prog-row"><div class="prow-top"><span>'+d.title+'</span><span>'+kn+'/'+tot+'</span></div>'+
              '<div class="prow-bar"><div class="prow-fill" style="width:'+pct+'%"></div></div></div>';
    }
    var pctAll = totAll ? Math.round(knAll/totAll*100) : 0;
    html += '<div class="prog-total">'+knAll+' of '+totAll+' terms marked solid ('+pctAll+'%)</div>';
    sidebarProgress.innerHTML = html;
  }

  function renderTabs(){
    var html = "";
    openTabs.forEach(function(id){
      var label = id==="roadmap" ? "ROADMAP.md" : domainById(id).file;
      html += '<div class="tab'+(id===activeId?" active":"")+'" data-tab="'+id+'">'+
              '<span>'+label+'</span><span class="close" data-close="'+id+'">&times;</span></div>';
    });
    tabbarEl.innerHTML = html;
    Array.prototype.forEach.call(tabbarEl.querySelectorAll(".tab"), function(tabEl){
      tabEl.addEventListener("click", function(ev){
        if (ev.target.hasAttribute("data-close")){
          ev.stopPropagation();
          closeTab(ev.target.getAttribute("data-close"));
          return;
        }
        activeId = tabEl.getAttribute("data-tab");
        render();
      });
    });
  }

  function openFile(id){
    if (openTabs.indexOf(id) === -1) openTabs.push(id);
    activeId = id;
    render();
  }
  function closeTab(id){
    var idx = openTabs.indexOf(id);
    if (idx > -1) openTabs.splice(idx,1);
    if (openTabs.length === 0) openTabs.push("roadmap");
    if (activeId === id) activeId = openTabs[openTabs.length-1];
    render();
  }

  function renderRoadmap(){
    var steps = [
      {t:"Programming Fundamentals + DSA", f:"fundamentals", n:"02_dsa.cpp", note:"Start here. This is the single biggest gap between what you can build and what a technical round tests — Big-O, trees, graphs, DP are pure vocabulary and pattern recognition, not new engineering skill."},
      {t:"Databases & Data Modeling", f:"databases", note:"ACID, normalization, indexing, SQL vs NoSQL. You already use Firestore daily — this fills in the formal terms for decisions you're already making by instinct."},
      {t:"Backend & API Design", f:"backend", note:"REST, auth (sessions/JWT/OAuth), middleware. Mostly naming things you've already built into Procurement, Places Enrichment, and World Shiner."},
      {t:"OS, Networking & Concurrency", f:"osnet", note:"Processes vs threads, TCP vs UDP, the event loop. The most 'pure CS' section — least tied to daily practical work, so budget real time here."},
      {t:"Frontend Engineering", f:"frontend", note:"Virtual DOM, hooks, the rendering pipeline. Likely your strongest section already — mainly about attaching correct terminology to what you do intuitively."},
      {t:"System Design & Scalability", f:"systemdesign", note:"The condensed index card here; the full 12-week System Design Mastery course is the deep-dive version of this same material."},
      {t:"Security Fundamentals", f:"security", note:"OWASP-style vocabulary: XSS, CSRF, injection, encryption vs hashing. Short section, disproportionately likely to come up as a quick-fire round."},
      {t:"Testing & Software Quality", f:"testing", note:"Unit vs integration vs E2E, TDD, mocking. Quick to review — mostly about using the right word for practices you already follow."},
      {t:"DevOps, Cloud & Version Control", f:"devops", note:"Git internals, CI/CD, containers. Your Netlify + GitHub deploy of the System Design course is a real, working example of a CI/CD pipeline — use it as your story."},
      {t:"Design Patterns & Architecture Styles", f:"patterns", note:"SOLID, GoF patterns, monolith vs microservices. Mostly vocabulary for structuring decisions you already make when a codebase starts feeling messy."},
      {t:"AI, LLMs & Agentic Systems", f:"ai", note:"Embeddings, RAG, agentic loops — directly tied to the RAG/Agentic AI upgrade project already running on your own tools. This is where interview prep and that project are the same work."},
    ];
    var html = '<h1 class="rm-title">Roadmap</h1>'+
      '<p class="rm-sub">All tech stacks, one reference — built to close the gap between what you can build and what a technical round tests for.</p>'+
      '<div class="rm-note"><b>Read this first —</b> the diagnosis behind this file is specific: your gap is CS-fundamentals and interview vocabulary, not practical ability. You\'ve shipped real production systems (World Shiner, GS BULK PI, the Customs Composer, the Places Enrichment pipeline). This cheatsheet exists to give you the correct name and precise definition for things you\'ve already built — that\'s what actually costs points in a technical round, not the building itself. Every term tagged <b>You\'ve shipped this</b> below ties straight back to one of your own projects.</div>'+
      '<ul class="rm-steps">';
    steps.forEach(function(s, i){
      html += '<li class="rm-step"><div class="rm-step-body"><h3><span class="rm-step-file" data-open="'+s.f+'">'+s.t+'</span></h3><p>'+s.note+'</p></div></li>';
    });
    html += '</ul>'+
      '<div class="rm-howto"><h3>How to use this</h3><ul>'+
      '<li>Work top to bottom your first pass — the order above is weighted toward your actual gap, DSA and OS/networking first.</li>'+
      '<li>Use the search bar (top right, or press <span class="kbd">/</span>) to cram or double-check a single term right before a call.</li>'+
      '<li>Tick the checkbox on a term once you can explain it out loud, from memory, in under 30 seconds — that\'s the actual bar for a technical round, not recognizing the definition when you read it.</li>'+
      '<li>Check the Progress panel (left icon rail) to see what\'s left before an interview.</li>'+
      '</ul></div>';
    editorInnerEl.innerHTML = html;
    Array.prototype.forEach.call(editorInnerEl.querySelectorAll("[data-open]"), function(el){
      el.addEventListener("click", function(){ openFile(el.getAttribute("data-open")); });
    });
  }

  function termId(domainId, si, ti){ return domainId+"-"+si+"-"+ti; }

  function renderDomain(d){
    var html = '<div class="dm-header"><h1 class="dm-title">'+d.title+'</h1><p class="dm-blurb">'+d.blurb+'</p></div>';
    d.sections.forEach(function(sec, si){
      html += '<div class="section-heading">'+sec.h+'</div>';
      sec.terms.forEach(function(term, ti){
        var id = termId(d.id, si, ti);
        var isKnown = !!known[id];
        html += '<div class="term-card'+(isKnown?" known":"")+'" id="term-'+id+'" data-term-id="'+id+'">'+
          '<div class="term-top"><input type="checkbox" class="term-check" data-check="'+id+'" '+(isKnown?"checked":"")+'>'+
          '<span class="term-name">'+term.t+'</span></div>'+
          '<div class="term-def">'+term.d+'</div>'+
          '<div class="term-logic">'+term.l+'</div>';
        if (term.a || term.p){
          html += '<div class="term-meta">';
          if (term.a) html += '<span class="term-ask"><b>Interview angle</b>'+term.a+'</span>';
          if (term.p) html += '<span class="term-anchor"><b>You\'ve shipped this</b>'+term.p+'</span>';
          html += '</div>';
        }
        html += '</div>';
      });
    });
    editorInnerEl.innerHTML = html;
    Array.prototype.forEach.call(editorInnerEl.querySelectorAll("[data-check]"), function(cb){
      cb.addEventListener("change", function(){
        var id = cb.getAttribute("data-check");
        known[id] = cb.checked;
        saveKnown();
        cb.closest(".term-card").classList.toggle("known", cb.checked);
        renderFileList();
        if (!sidebarProgress.hidden) renderProgressPanel();
      });
    });
  }

  function render(){
    renderFileList();
    renderTabs();
    if (activeId === "roadmap") renderRoadmap();
    else renderDomain(domainById(activeId));
  }

  // ---- Search ----
  function allTermsFlat(){
    var out = [];
    DOMAINS.forEach(function(d){
      d.sections.forEach(function(sec, si){
        sec.terms.forEach(function(term, ti){
          out.push({domain:d, id:termId(d.id, si, ti), term:term});
        });
      });
    });
    return out;
  }
  var FLAT = allTermsFlat();

  function runSearch(q){
    q = q.trim().toLowerCase();
    if (!q){ resultsEl.hidden = true; resultsEl.innerHTML = ""; return; }
    var matches = FLAT.filter(function(item){
      return item.term.t.toLowerCase().indexOf(q) > -1 || item.term.d.toLowerCase().indexOf(q) > -1;
    }).slice(0, 24);
    if (!matches.length){
      resultsEl.innerHTML = '<div class="result-empty">No terms match "'+q.replace(/</g,"&lt;")+'"</div>';
      resultsEl.hidden = false;
      return;
    }
    resultsEl.innerHTML = matches.map(function(item){
      return '<div class="result-item" data-goto-domain="'+item.domain.id+'" data-goto-term="'+item.id+'">'+
        '<span class="result-term">'+item.term.t+'</span><span class="result-file">'+item.domain.file+'</span>'+
        '<div class="result-def">'+item.term.d+'</div></div>';
    }).join("");
    resultsEl.hidden = false;
    Array.prototype.forEach.call(resultsEl.querySelectorAll(".result-item"), function(row){
      row.addEventListener("click", function(){
        var dId = row.getAttribute("data-goto-domain");
        var tId = row.getAttribute("data-goto-term");
        searchInput.value = "";
        resultsEl.hidden = true;
        openFile(dId);
        setTimeout(function(){
          var el = document.getElementById("term-"+tId);
          if (el){
            el.scrollIntoView({block:"center", behavior:"smooth"});
            el.classList.add("flash");
            setTimeout(function(){ el.classList.remove("flash"); }, 2200);
          }
        }, 30);
      });
    });
  }
  searchInput.addEventListener("input", function(){ runSearch(searchInput.value); });
  searchInput.addEventListener("keydown", function(ev){ if (ev.key === "Escape"){ searchInput.value=""; resultsEl.hidden=true; searchInput.blur(); } });
  document.addEventListener("click", function(ev){
    if (!ev.target.closest(".searchwrap")) { resultsEl.hidden = true; }
  });
  document.addEventListener("keydown", function(ev){
    if (ev.key === "/" && document.activeElement !== searchInput && !/input|textarea/i.test(document.activeElement.tagName)){
      ev.preventDefault(); searchInput.focus();
    }
  });

  // ---- Activity bar switch ----
  actExplorer.addEventListener("click", function(){
    actExplorer.classList.add("active"); actProgress.classList.remove("active");
    sidebarExplorer.hidden = false; sidebarProgress.hidden = true;
  });
  actProgress.addEventListener("click", function(){
    actProgress.classList.add("active"); actExplorer.classList.remove("active");
    sidebarExplorer.hidden = true; sidebarProgress.hidden = false;
    renderProgressPanel();
  });

  // ---- Mobile sidebar ----
  function openSidebarMobile(){ sidebarEl.classList.add("open"); overlayEl.classList.add("show"); }
  function closeSidebarMobile(){ sidebarEl.classList.remove("open"); overlayEl.classList.remove("show"); }
  menuBtn.addEventListener("click", openSidebarMobile);
  overlayEl.addEventListener("click", closeSidebarMobile);

  render();
})();
</script>

</body>
</html>
